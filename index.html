function recordsPage(p){let config={incidents:{name:'Vorfälle',sub:'Ereignisse und besondere Beobachtungen dokumentieren.',new:'Vorfall erfassen',type:'incident'},visitors:{name:'Besucherverwaltung',sub:'An- und Abmeldungen für Besucher und Fremdfirmen.',new:'Besucher anmelden',type:'visitor'},keys:{name:'Schlüsselübergaben',sub:'Nachvollziehbare Ausgabe und Rücknahme von Schlüsseln.',new:'Übergabe erfassen',type:'key'},shifts:{name:'Schichtprotokolle',sub:'Schichtverläufe, Übergaben und besondere Hinweise.',new:'Protokoll erstellen',type:'shift'},reports:{name:'Berichte & Export',sub:'Dienstbucheinträge prüfen und als PDF-Bericht ausgeben.',new:'Als PDF exportieren'}}[p];let data={incidents:db.incidents,visitors:db.visitors,keys:db.keys,shifts:db.shifts,reports:[...db.shifts,...db.incidents]}[p]||[];if(p==='reports')data=[...db.incidents.map(x=>({...x,kind:'Vorfall'})),...db.visitors.map(x=>({...x,title:`Besuch: ${x.name}`,person:x.host,detail:`${x.company} · ${x.purpose} · Ausweis ${x.badge}`,time:x.arrival,kind:'Besucher'})),...db.keys.map(x=>({...x,title:`Schlüsselübergabe: ${x.key}`,person:`${x.from} → ${x.to}`,detail:`${x.number} · ${x.note}`,time:x.time,kind:'Schlüssel'})),...db.shifts.map(x=>({...x,title:x.shift,person:x.lead,detail:x.summary,time:x.start,kind:'Schichtprotokoll'}))];let filtered=data.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase())&&(filter==='Alle'||x.status===filter));let filters=p==='incidents'?['Alle','Offen','In Bearbeitung','Abgeschlossen']:p==='visitors'?['Alle','Anwesend','Abgemeldet']:p==='keys'?['Alle','Ausgegeben','Zurückgegeben']:p==='shifts'?['Alle','Laufend','Abgeschlossen']:[];let headings={incidents:['Kennung / Vorfall','Ort','Meldende Person','Zeitpunkt','Priorität','Status'],visitors:['Besucher','Unternehmen / Anlass','Ansprechperson','Ankunft','Ausweis','Status'],keys:['Schlüssel / Nr.','Übergeben von → an','Zeitpunkt','Notiz','Status'],shifts:['Protokoll / Schicht','Schichtführer','Zeitraum','Zusammenfassung','Status'],reports:['Eintrag / Typ','Erfasst von','Zeitpunkt','Details','Status']}[p];let rows=filtered.map(x=>{if(p==='incidents')return `<tr><td><b>${esc(x.title)}</b><br><span style="color:#8a948d">${esc(x.id)} · ${esc(x.type)}</span></td><td>${esc(x.place)}</td><td>${esc(x.person)}</td><td>${date(x.time)}</td><td>${badge(x.priority)}</td><td>${badge(x.status)} ${canLead()&&x.status!=='Abgeschlossen'?`<button class="link" data-done="incident:${x.id}">Erledigen</button>`:''}</td></tr>`;if(p==='visitors')return `<tr><td><b>${esc(x.name)}</b><br><span style="color:#8a948d">${esc(x.id)}</span></td><td>${esc(x.company)}<br><span style="color:#8a948d">${esc(x.purpose)}</span></td><td>${esc(x.host)}</td><td>${date(x.arrival)}</td><td>${esc(x.badge)}</td><td>${badge(x.status)} ${x.status==='Anwesend'&&canLead()?`<button class="link" data-done="visitor:${x.id}">Abmelden</button>`:''}</td></tr>`;if(p==='keys')return `<tr><td><b>${esc(x.key)}</b><br><span style="color:#8a948d">${esc(x.id)} · ${esc(x.number)}</span></td><td>${esc(x.from)} → ${esc(x.to)}</td><td>${date(x.time)}</td><td>${esc(x.note)}</td><td>${badge(x.status)} ${x.status==='Ausgegeben'&&canLead()?`<button class="link" data-done="key:${x.id}">Rückgabe</button>`:''}</td></tr>`;if(p==='shifts')return `<tr><td><b>${esc(x.shift)}</b><br><span style="color:#8a948d">${esc(x.id)}</span></td><td>${esc(x.lead)}</td><td>${date(x.start)}${x.end?' – '+date(x.end):''}</td><td style="max-width:290px;white-space:normal">${esc(x.summary)}</td><td>${badge(x.status)}</td></tr>`;return `<tr><td><b>${esc(x.title)}</b><br><span style="color:#8a948d">${esc(x.kind)} · ${esc(x.id)}</span></td><td>${esc(x.person||'—')}</td><td>${date(x.time)}</td><td style="max-width:330px;white-space:normal">${esc(x.detail||x.summary)}</td><td>${badge(x.status)}</td></tr>`}).join('');return `<div class="page-title"><div><div class="eyebrow">Dienstbuch · TOR B</div><h1>${config.name}</h1><p>${config.sub}</p></div><button class="btn" ${p==='reports'?'id="export"':`data-new="${config.type}"`}>${p==='reports'?'↓':'＋'}&nbsp; ${config.new}</button></div>${p==='reports'?`<div class="admin-note">PDF-Export öffnet den Druckdialog Ihres Browsers. Wählen Sie dort „Als PDF speichern“ für einen revisionsfreundlichen Bericht.</div><div class="report-head"><h1>Elektronisches Dienstbuch · Wache TOR B</h1><p>VW Motorenwerk Chemnitz · Berichtszeitpunkt: ${date(new Date())} · Erstellt durch: ${esc(user.name)}</p></div>`:''}<div class="panel table-panel"><div class="panel-head"><div><h2>${p==='reports'?'Berichtsübersicht':config.name}</h2><p>${filtered.length} ${filtered.length===1?'Eintrag':'Einträge'} · zuletzt aktualisiert ${date(new Date(),false)}</p></div><div class="toolbar">${filters.length?`<select class="filter" id="filter">${filters.map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>`:''}${p==='reports'?'<button class="btn secondary small" id="export2">PDF drucken</button>':''}</div></div>${filtered.length?`<div class="table-wrap"><table><thead><tr>${headings.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Keine passenden Einträge gefunden.</div>`}</div>`}
function usersPage(){if(!admin())return '<div class="empty">Zugriff verweigert</div>';return `<div class="page-title"><div><div class="eyebrow">Administration · TOR B</div><h1>Benutzerverwaltung</h1><p>Konten, Rollen und Zugriffsberechtigungen verwalten.</p></div><button class="btn" data-new="user">＋&nbsp; Benutzer anlegen</button></div><div class="admin-note">Demo-Administration: Änderungen werden lokal in diesem Browser gespeichert. Für den produktiven Einsatz ist eine zentrale Authentifizierung erforderlich.</div><div class="panel table-panel"><div class="panel-head"><div><h2>Dienstkonten</h2><p>${db.users.filter(x=>x.active).length} aktive Konten</p></div></div><div class="table-wrap"><table><thead><tr><th>Mitarbeiter</th><th>Benutzername</th><th>Rolle</th><th>Status</th><th>Aktion</th></tr></thead><tbody>${db.users.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase())).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.username)}</td><td>${badge(x.role)}</td><td>${badge(x.active?'Aktiv':'Deaktiviert')}</td><td>${x.username!==user.username?`<button class="link" data-user-toggle="${esc(x.username)}">${x.active?'Deaktivieren':'Aktivieren'}</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function dashboard(){
let open=db.incidents.filter(x=>x.status!=='Abgeschlossen').length,onsite=db.visitors.filter(x=>x.status==='Anwesend').length,keys=db.keys.filter(x=>x.status==='Ausgegeben').length,now=new Date().toISOString().slice(0,10),today=db.incidents.filter(x=>x.time.slice(0,10)===now).length;let act=[...db.incidents.map(x=>({icon:'⚑',tone:x.priority==='Hoch'?'red':'',title:x.title,desc:`${x.place} · ${x.person}`,time:x.time})),...db.visitors.map(x=>({icon:'♙',tone:'green',title:`Besucher ${x.status==='Anwesend'?'angemeldet':'abgemeldet'}`,desc:`${x.name} · ${x.company}`,time:x.arrival}))].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,5);return `<div class="hello"><div><div class="eyebrow">Dienstag, 03. November 2026</div><h1>Guten Tag, ${esc(user.name.split(' ')[0])} 👋</h1><p>Hier ist die aktuelle Lageübersicht der Wache TOR B.</p></div><button class="btn" data-new="incident">＋&nbsp; Vorfall erfassen</button></div><div class="stats"><div class="stat"><div class="stat-top">Offene Vorfälle<span class="stat-icon">⚑</span></div><div class="stat-num">${open}</div><div class="stat-note"><em>${db.incidents.filter(x=>x.status==='In Bearbeitung').length} in Bearbeitung</em> · Aufmerksamkeit erforderlich</div></div><div class="stat"><div class="stat-top">Besucher im Objekt<span class="stat-icon">♙</span></div><div class="stat-num">${onsite.toString().padStart(2,'0')}</div><div class="stat-note">Aktuell angemeldete Gäste</div></div><div class="stat"><div class="stat-top">Ausgegebene Schlüssel<span class="stat-icon">⚿</span></div><div class="stat-num">${keys.toString().padStart(2,'0')}</div><div class="stat-note">Rückgabe zum Schichtende prüfen</div></div><div class="stat"><div class="stat-top">Vorfälle heute<span class="stat-icon">▤</span></div><div class="stat-num">${today||db.incidents.length}</div><div class="stat-note"><em>Schicht läuft</em> · seit 06:00 Uhr</div></div></div><div class="grid"><div class="panel"><div class="panel-head"><div><h2>Letzte Aktivitäten</h2><p>Aktuelle Einträge im Dienstbuch</p></div><button class="link" data-page="incidents">Alle Einträge →</button></div><div class="activity">${act.map(a=>`<div class="activity-item"><div class="activity-mark ${a.tone}">${a.icon}</div><div class="activity-copy"><b>${esc(a.title)}</b><p>${esc(a.desc)}</p></div><time class="activity-time">${date(a.time)}</time></div>`).join('')}</div></div><div class="right-col"><div class="panel handover"><div class="panel-head"><div><h2>Schichtstatus</h2><p>Aktuelle Besetzung</p></div><span class="badge green">Aktiv</span></div><div class="handover-body"><div class="handover-row"><span>Schichtführer</span><b>Jana Richter</b></div><div class="handover-row"><span>Schichtzeit</span><b>06:00 – 14:00</b></div><div class="handover-row"><span>Nächste Übergabe</span><b>in 4 Std. 12 Min.</b></div></div></div><div class="panel quick"><h2>Schnellzugriff</h2><div class="quick-list"><button data-new="visitor"><span>♙</span>Besucher anmelden</button><button data-new="key"><span>⚿</span>Schlüssel übergeben</button><button data-new="shift"><span>▤</span>Schichtprotokoll</button><button data-page="reports"><span>▧</span>Bericht erstellen</button></div></div></div></div>`}
const schemas={incident:{title:'Vorfall erfassen',fields:[['title','Bezeichnung','text',1],['type','Kategorie','select','Zutrittskontrolle|Technischer Mangel|Besuch|Sicherheitsereignis|Sonstiges'],['place','Ort','text',1],['priority','Priorität','select','Niedrig|Mittel|Hoch'],['detail','Sachverhalt / Maßnahmen','textarea',1]]},visitor:{title:'Besucher anmelden',fields:[['name','Vor- und Nachname','text',1],['company','Unternehmen','text',1],['host','Ansprechperson im Werk','text',1],['purpose','Besuchsgrund','text',1],['badge','Besucherausweis','text',1]]},key:{title:'Schlüsselübergabe erfassen',fields:[['key','Schlüssel / Schlüsselbund','text',1],['number','Schlüsselnummer','text',1],['to','Empfänger/in','text',1],['note','Hinweis / Rückgabezeit','text',1]]},shift:{title:'Schichtprotokoll erstellen',fields:[['shift','Schicht','select','Frühschicht|Spätschicht|Nachtschicht'],['summary','Verlauf und Übergabehinweise','textarea',1]]},user:{title:'Dienstkonto anlegen',fields:[['name','Anzeigename','text',1],['username','Benutzername','text',1],['password','Startpasswort','password',1],['role','Rolle','select','Wachpersonal|Schichtführer|Administrator']]}};
function openModal(type){if(type==='user'&&!admin())return toast('Keine Berechtigung für die Benutzerverwaltung.');if(type==='shift'&&!canLead())return toast('Schichtprotokolle können nur durch Schichtführer angelegt werden.');let s=schemas[type];if(!s)return;let html=s.fields.map(([id,label,kind,opts])=>`<div class="field ${kind==='textarea'?'full':''}"><label for="f_${id}">${label}</label>${kind==='select'?`<select id="f_${id}" required>${opts.split('|').map(v=>`<option>${v}</option>`).join('')}</select>`:kind==='textarea'?`<textarea id="f_${id}" required placeholder="Eintrag dokumentieren …"></textarea>`:`<input id="f_${id}" type="${kind}" ${opts?'required':''} ${id==='password'?'minlength="6"':''} placeholder="${id==='badge'?'z. B. B-085':''}">`}</div>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modalBack"><form class="modal" id="entryForm"><div class="modal-head"><h2>${s.title}</h2><button class="close" type="button" id="closeModal">×</button></div><div class="modal-body"><div class="form-grid">${html}</div></div><div class="modal-foot"><button type="button" class="btn secondary" id="cancelModal">Abbrechen</button><button class="btn">Eintrag speichern</button></div></form></div>`);$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modalBack').remove();$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')e.currentTarget.remove()};$('#entryForm').onsubmit=e=>{e.preventDefault();let val=Object.fromEntries(s.fields.map(([id])=>[id,$('#f_'+id).value.trim()])),now=new Date().toISOString(),id;if(type==='incident'){id='V-'+now.slice(0,4)+'-'+String(100+db.incidents.length+1);db.incidents.unshift({...val,id,person:user.name,time:now,status:'Offen'})}if(type==='visitor'){id='B-'+now.slice(0,4)+'-'+String(100+db.visitors.length+1);db.visitors.unshift({...val,id,arrival:now,status:'Anwesend'})}if(type==='key'){id='K-'+String(1+db.keys.length).padStart(3,'0');db.keys.unshift({...val,id,from:user.name,time:now,status:'Ausgegeben'})}if(type==='shift'){id='SP-'+now.slice(0,10).replaceAll('-','')+'-'+String(db.shifts.length+1);db.shifts.unshift({...val,id,lead:user.name,start:now,status:'Laufend'})}if(type==='user'){if(db.users.some(x=>x.username===val.username)){return toast('Dieser Benutzername ist bereits vergeben.')}db.users.push({...val,active:true})}persist();$('#modalBack').remove();render();toast('Eintrag erfolgreich gespeichert.')}}
function toast(msg){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">✓ &nbsp;${esc(msg)}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2800)}
function wirePage(){document.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>openModal(x.dataset.new));document.querySelectorAll('[data-page]').forEach(x=>{if(!x.closest('.nav'))x.onclick=()=>{page=x.dataset.page;render()}});document.querySelectorAll('[data-done]').forEach(x=>x.onclick=()=>{if(!canLead())return toast('Aktion nur für Schichtführer.');let [type,id]=x.dataset.done.split(':');let group=type==='incident'?db.incidents:type==='visitor'?db.visitors:db.keys,item=group.find(v=>v.id===id);if(!item)return;if(type==='incident')item.status='Abgeschlossen';else if(type==='visitor')item.status='Abgemeldet';else item.status='Zurückgegeben';persist();render();toast(type==='incident'?'Vorfall abgeschlossen.':type==='visitor'?'Besucher abgemeldet.':'Schlüsselrückgabe erfasst.')});$('#filter')&&($('#filter').onchange=e=>{filter=e.target.value;render()});$('#export')&&($('#export').onclick=()=>window.print());$('#export2')&&($('#export2').onclick=()=>window.print());document.querySelectorAll('[data-user-toggle]').forEach(x=>x.onclick=()=>{let u=db.users.find(v=>v.username===x.dataset.userToggle);if(u){u.active=!u.active;persist();render();toast('Benutzerstatus aktualisiert.')}})}
if(user)render();else startLogin();
</script></body></html>
